# LLM / 임베딩 모델 설정
# - 코드에는 모델명·주소를 하드코딩하지 않고 이 파일에서 읽는다 (llm/client.py, llm/router.py).
# - 현재: OpenAI API 사용 (base_url: null → OpenAI 기본 주소).
# - vLLM 전환 시: base_url을 vLLM 주소로, model을 --served-model-name 값으로, api_key_env를 VLLM_API_KEY로 바꾼다.
#     large → http://localhost:8001/v1, small → http://localhost:8002/v1, embedding → http://localhost:8003/v1
# - API 키는 여기 쓰지 않는다. api_key_env에 적힌 환경변수(.env)에서 읽는다.

models:
  large:                      # 판단·작성: Supervisor, Writer, Reviewer 등
    base_url: null
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    temperature: 0.2
    max_tokens: 4096
    timeout: 120
    max_retries: 2

  small:                      # 반복 검색·분류: Researcher 루프, Router, 수치 추출 등
    base_url: null
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 2048
    timeout: 60
    max_retries: 2

  embedding:                  # 벡터 DB용 (OpenAIEmbeddings)
    base_url: null
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY

# 노드(역할) → 사용할 모델.
# temperature를 적으면 그 역할에서만 모델 기본값을 덮어쓴다.
# GPU 1장으로 vLLM 하나만 띄울 때는 모든 model을 같은 키(예: large)로 바꾸면 된다.
roles:
  # Deep Research 흐름 (research/nodes)
  clarify:         { model: large }
  brief:           { model: large }
  supervisor:      { model: large }
  compress:        { model: large, temperature: 0.0 }   # 수치·출처 ID를 원문 그대로 유지
  outline:         { model: large }
  writer:          { model: large, temperature: 0.3 }
  reviewer:        { model: large, temperature: 0.0 }

  # Researcher 내부 루프 (research/loop)
  loop_planner:    { model: small }
  loop_router:     { model: small }
  loop_executor:   { model: small }
  loop_findings:   { model: small }
  loop_evaluator:  { model: small }

  # PDF 검증 데모
  claim_extractor: { model: small }                     # AI 보고서에서 수치 주장 추출 (JSON)
