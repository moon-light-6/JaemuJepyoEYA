# 보고서 하위 주제 템플릿 (brief 노드가 읽음)
# - 요약·결론은 조사 대상이 아니라 writer가 조사 결과로 쓰는 섹션이라 여기 없음
# - required_metrics: 평가의 "필수 항목 포함률" 기준. evaluation/dataset/report_tasks.jsonl과 맞출 것
# - default_questions: LLM이 질문 생성에 실패했을 때 쓰는 예비 질문. {company}, {years}, {scope}가 치환됨
# - id를 바꾸거나 추가하면 research/nodes/brief.py의 SubtopicId도 같이 바꿀 것

subtopics:
  - id: profitability
    title: 수익성
    required_metrics: [매출액, 영업이익, 영업이익률, 당기순이익]
    default_questions:
      - "{company}의 {years} {scope} 기준 매출액, 영업이익, 당기순이익은 얼마인가?"
      - "{company}의 {years} 영업이익률 수준과 변동 원인은 무엇인가?"

  - id: stability
    title: 재무 안정성
    required_metrics: [부채비율, 유동비율, 자본총계]
    default_questions:
      - "{company}의 {years} {scope} 기준 부채총계, 자본총계, 유동자산, 유동부채는 얼마인가?"
      - "{company}의 {years} {scope} 기준 부채비율과 유동비율을 계산해줘."

  - id: cashflow
    title: 현금흐름
    required_metrics: [영업활동현금흐름, 투자활동현금흐름, 재무활동현금흐름, 현금및현금성자산]
    default_questions:
      - "{company}의 {years} {scope} 기준 영업·투자·재무활동 현금흐름은 얼마인가?"
      - "{company}의 {years} 기말 현금및현금성자산과 주요 현금 사용처는 무엇인가?"

  - id: risk
    title: 리스크
    required_metrics: [감사의견, 우발부채, 소송]
    default_questions:
      - "{company}의 {years} 감사의견과 핵심감사사항은 무엇인가?"
      - "{company}의 {years} 주요 우발부채, 소송, 약정 사항은 무엇인가?"
