# 보고서 하위 주제 템플릿 (brief 노드가 읽음)
# - 요약·결론은 조사 대상이 아니라 writer가 조사 결과로 쓰는 섹션이라 여기 없음
# - required_metrics: 평가의 "필수 항목 포함률" 기준. evaluation/dataset/report_tasks.jsonl과 맞출 것
# - default_questions: LLM이 질문 생성에 실패했을 때 쓰는 예비 질문. {company}, {years}가 치환됨
# - id를 바꾸거나 추가하면 research/nodes/brief.py의 SubtopicId도 같이 바꿀 것

subtopics:
  - id: profitability
    title: 수익성
    required_metrics: [매출액, 영업이익, 영업이익률, 당기순이익]
    default_questions:
      - "{company}의 {years} 연결 기준 매출액, 영업이익, 당기순이익은 얼마인가?"
      - "{company}의 {years} 영업이익률 수준과 변동 원인은 무엇인가?"

  - id: stability
    title: 재무 안정성
    required_metrics: [부채비율, 유동비율, 자본총계, 차입금]
    default_questions:
      - "{company}의 {years} 연결 기준 부채총계, 자본총계, 유동자산, 유동부채는 얼마인가?"
      - "{company}의 {years} 차입금 규모와 만기 구조는 어떠한가?"

  - id: cashflow
    title: 현금흐름
    required_metrics: [영업활동현금흐름, 투자활동현금흐름, 재무활동현금흐름, 현금및현금성자산]
    default_questions:
      - "{company}의 {years} 연결 기준 영업·투자·재무활동 현금흐름은 얼마인가?"
      - "{company}의 {years} 기말 현금및현금성자산과 주요 현금 사용처는 무엇인가?"

  - id: risk
    title: 리스크
    # 감사의견은 검색 색인에 없어(재무제표·주석만 색인) 제외. 감사의견 DB 적재 후 다시 넣는다.
    # 주석 제목이 기업마다 '우발채무'·'우발부채'로 달라 질문에 공시 용어(우발채무 및 약정사항)를 쓴다.
    required_metrics: [우발채무, 소송, 지급보증, 담보제공]
    # LLM이 질문을 '표의 주요 항목' 같은 일반 표현으로 바꾸면 검색이 주석을 못 찾는다.
    # true면 brief·supervisor가 질문을 새로 쓰지 않고 아래 기본 질문을 그대로 쓴다.
    fixed_questions: true
    default_questions:
      - "{company}의 {years} 연결재무제표 주석에서 우발채무 및 약정사항으로 공시된 소송사건의 건수와 소송가액은 얼마인가?"
      - "{company}의 {years} 연결재무제표 주석에 공시된 지급보증과 담보로 제공한 자산의 내용은 무엇인가?"
