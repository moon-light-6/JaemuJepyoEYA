# 보고서 하위 주제 템플릿 (brief 노드가 읽음)
# - 요약·결론은 조사 대상이 아니라 writer가 조사 결과로 쓰는 섹션이라 여기 없음
# - required_metrics: 평가의 "필수 항목 포함률" 기준. evaluation/dataset/report_tasks.jsonl과 맞출 것
# - default_questions: LLM이 질문 생성에 실패했을 때 쓰는 예비 질문. {company}, {years}가 치환됨
# - id를 바꾸거나 추가하면 research/nodes/brief.py의 SubtopicId도 같이 바꿀 것
# - db_items: DART 재무제표 DB(fin.dart_financial_accounts)에서 코드가 가져올 계정 (account_aliases.yaml의 키)
#   db_ratios: 그 계정으로 코드가 계산할 비율 (tools/ratios.py). LLM은 이 숫자를 찾거나 계산하지 않는다.
#   DB에 값이 있으면 brief는 이 숫자를 묻지 않고 원인·구성·구조를 묻는 질문을 쓴다 (Hybrid RAG)

subtopics:
  - id: profitability
    title: 수익성
    required_metrics: [매출액, 영업이익, 영업이익률, 당기순이익]
    db_items: [revenue, operating_income, net_income]
    db_ratios: [operating_profit_margin, return_on_equity]
    default_questions:
      - "{company}의 {years} {scope} 기준 매출의 부문별 구성은 어떠한가?"
      - "{company}의 {years} 영업이익 변동의 주요 원인은 무엇인가?"

  - id: stability
    title: 재무 안정성
    required_metrics: [부채비율, 유동비율, 자본총계, 차입금]
    db_items: [total_assets, total_liabilities, total_equity, current_assets, current_liabilities]
    db_ratios: [debt_ratio, current_ratio]
    default_questions:
      - "{company}의 {years} {scope}재무제표 주석에 공시된 차입금(단기·장기차입금, 사채)의 규모와 만기 구조는 어떠한가?"
      - "{company}의 {years} {scope} 기준 부채의 주요 구성 항목은 무엇인가?"

  - id: cashflow
    title: 현금흐름
    required_metrics: [영업활동현금흐름, 투자활동현금흐름, 재무활동현금흐름, 현금및현금성자산]
    db_items: [operating_cash_flow, investing_cash_flow, financing_cash_flow, cash_and_equivalents]
    db_ratios: []
    default_questions:
      - "{company}의 {years} {scope} 현금흐름표에서 투자활동의 주요 현금 사용처는 무엇인가?"
      - "{company}의 {years} {scope} 현금흐름표에서 재무활동의 주요 항목(차입·상환·배당)은 무엇인가?"

  - id: risk
    title: 리스크
    # 감사의견은 추가 수집한 원문 범위에서 확인하고, 없는 기업은 보류한다.
    # 주석 제목이 기업마다 '우발채무'·'우발부채'로 달라 질문에 공시 용어(우발채무 및 약정사항)를 쓴다.
    required_metrics: [감사의견, 우발채무, 소송, 지급보증, 담보제공]
    # LLM이 질문을 '표의 주요 항목' 같은 일반 표현으로 바꾸면 검색이 주석을 못 찾는다.
    # true면 brief·supervisor가 질문을 새로 쓰지 않고 아래 기본 질문을 그대로 쓴다.
    fixed_questions: true
    default_questions:
      - "{company}의 {years} {scope}재무제표 주석에서 우발채무 및 약정사항으로 공시된 소송사건의 건수와 소송가액은 얼마인가?"
      - "{company}의 {years} {scope}재무제표 주석에 공시된 지급보증과 담보로 제공한 자산의 내용은 무엇인가?"
      - "{company}의 {years} {scope} 기준 감사의견과 핵심감사사항은 무엇인가?"
