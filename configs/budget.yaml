# 실행(run) 1회분 예산
# - limits: 안전장치. Budget 클래스가 강제하며, 넘으면 다음 LLM 호출 전에 BudgetExceeded로 중단한다.
# - research: 설계값. 오케스트레이션(supervisor 등)이 계획을 세울 때 읽는다.
# - null = 제한 없음. 값은 4주차 "예산값 튜닝"에서 실험 결과를 보고 조정한다.

limits:
  max_llm_calls: 200
  max_total_tokens: 500000     # 입력 + 출력 토큰 합계
  max_seconds: 900             # 실행 전체 시간 (15분)

research:
  max_researchers: 3           # supervisor가 동시에 보내는 researcher 수
  max_rounds: 2                # 계획서: 조사 단계 최대 2라운드 (누락 주제 재분배 포함)
  loop_max_iterations: 3       # researcher 내부 루프 반복 상한 (루프 담당과 협의)
