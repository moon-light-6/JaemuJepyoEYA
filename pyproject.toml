[project]
name = "jaemujepyoeya"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-core>=1.8.1",
    "langchain-community>=0.4.2",
    "python-dotenv>=1.2.4",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "psycopg2-binary>=2.9,<3",
    "sqlglot>=28,<29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ 레이아웃: src/fin_research 패키지를 설치 대상으로 지정
[tool.setuptools.packages.find]
where = ["src"]
